<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AoE2 Lobby Observer</title>
  <meta name="description" content="Live list of open Age of Empires II: Definitive Edition lobbies.">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="icon.svg" alt="" width="28" height="28">
      <h1>AoE2 Lobby Observer</h1>
    </div>
    <div class="status" id="status" aria-live="polite">
      <span class="dot"></span><span id="status-text">Connecting…</span>
    </div>
    <input id="search" type="search" placeholder="Search title, map, player…" autocomplete="off">
    <select id="map-filter" aria-label="Filter by map"><option value="">All maps</option></select>
    <button id="toggle-filters" class="btn" aria-expanded="false" aria-controls="filters">Filters</button>
  </header>

  <section id="filters" class="filters" hidden>
    <label>Rating
      <select id="ladder">
        <option value="auto">Auto (1v1 or team by lobby size)</option>
        <option value="rm1v1">1v1 Random Map</option>
        <option value="rmTeam">Team Random Map</option>
        <option value="ew1v1">1v1 Empire Wars</option>
        <option value="ewTeam">Team Empire Wars</option>
      </select>
    </label>
    <label>Min Elo <input id="min-elo" type="number" step="50" placeholder="any"></label>
    <label>Max Elo <input id="max-elo" type="number" step="50" placeholder="any"></label>
    <label class="check"><input id="hide-full" type="checkbox"> Hide full</label>
    <label class="check"><input id="hide-password" type="checkbox"> Hide password protected</label>
    <label class="check"><input id="hide-custom" type="checkbox"> Hide scenarios &amp; mods</label>
    <label class="check"><input id="show-hidden" type="checkbox"> Show lobbies I hid</label>
    <button id="reset-filters" class="btn ghost">Reset</button>
  </section>

  <main>
    <table class="lobbies">
      <thead>
        <tr>
          <th data-sort="elo" class="num">Elo</th>
          <th data-sort="title">Title</th>
          <th data-sort="map">Map</th>
          <th data-sort="host" class="opt">Host</th>
          <th data-sort="firstSeen" class="opt wide">Created</th>
          <th data-sort="players" class="num">Players</th>
          <th class="icon" title="Password protected">🔒</th>
          <th class="actions">Actions</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <p id="empty" class="empty" hidden>No lobbies match your filters.</p>
  </main>

  <footer>
    Data from the official Age of Empires II: DE game servers. Fan project, not affiliated with Microsoft or World's Edge.
    <a href="https://github.com/andreastegle-stack/aoe2-lobby-observer" target="_blank" rel="noopener">Open source on GitHub</a> – contributions welcome.
  </footer>

  <script src="app.js"></script>
</body>
</html>
